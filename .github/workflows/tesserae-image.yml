name: tesserae image

# Pull requests: validate the pin and the template, push nothing.
# main: copy the pinned upstream digest unchanged to our registry as :<version> and :stable.

on:
  pull_request:
    paths:
      - tesserae/**
      - tesserae.xml
      - .github/workflows/tesserae-image.yml
  push:
    branches: [main]
    paths:
      - tesserae/Dockerfile
      - .github/workflows/tesserae-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesserae-image-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE: ghcr.io/dmellok/tesserae
  TARGET: ghcr.io/${{ github.repository_owner }}/tesserae

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pin.outputs.version }}
      digest: ${{ steps.pin.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read pin
        id: pin
        run: |
          from=$(sed -n 's/^FROM[[:space:]]\{1,\}//p' tesserae/Dockerfile)
          re="^${SOURCE//./\\.}:([0-9]+\.[0-9]+\.[0-9]+)@(sha256:[0-9a-f]{64})$"
          if [[ ! $from =~ $re ]]; then
            echo "::error file=tesserae/Dockerfile::Expected FROM $SOURCE:<x.y.z>@sha256:<digest>, got: $from"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "digest=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Tag resolves to pinned digest upstream
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          DIGEST: ${{ steps.pin.outputs.digest }}
        run: |
          actual=$(docker buildx imagetools inspect "$SOURCE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ $actual != "$DIGEST" ]]; then
            echo "::error::$SOURCE:$VERSION is $actual, pin says $DIGEST"
            exit 1
          fi

      - name: Template is valid and points at :stable
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          repo = ET.parse("tesserae.xml").getroot().findtext("Repository")
          want = os.environ["TARGET"] + ":stable"
          if repo != want:
              sys.exit(f"tesserae.xml Repository is {repo!r}, expected {want!r}")
          PY

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DIGEST: ${{ needs.check.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy unchanged
        run: |
          # A version tag is never overwritten; if it exists it must already be this digest.
          if existing=$(docker buildx imagetools inspect "$TARGET:$VERSION" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest); then
            if [[ $existing != "$DIGEST" ]]; then
              echo "::error::$TARGET:$VERSION already exists as $existing, refusing to overwrite with $DIGEST"
              exit 1
            fi
            docker buildx imagetools create --tag "$TARGET:stable" "$SOURCE@$DIGEST"
          else
            docker buildx imagetools create --tag "$TARGET:$VERSION" --tag "$TARGET:stable" "$SOURCE@$DIGEST"
          fi

      - name: Verify digests match upstream
        run: |
          for tag in "$VERSION" stable; do
            actual=$(docker buildx imagetools inspect "$TARGET:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [[ $actual != "$DIGEST" ]]; then
              echo "::error::$TARGET:$tag is $actual, expected $DIGEST"
              exit 1
            fi
          done
          echo "$TARGET:$VERSION and :stable = $SOURCE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
